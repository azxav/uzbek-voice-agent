[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uzbek-voice-agent"
version = "0.1.0"
description = "Personal portfolio demo: Uzbek speech-to-text with NavAI Whisper-small and a LiveKit agent worker."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "azxav" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "numpy>=1.26",
  "soundfile>=0.12",
  "jiwer>=3.0",
]

[project.optional-dependencies]
asr = [
  "torch>=2.2",
  "transformers>=4.46",
  "datasets>=3.0",
  "huggingface-hub>=0.26",
]
agent = [
  "livekit-agents>=1.2,<2",
  "python-dotenv>=1.0",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.scripts]
uzbek-voice-api = "uzbek_voice_agent.api:main"
uzbek-eval-asr = "uzbek_voice_agent.eval_asr:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
