name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system audio library
        run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - name: Install package without model weights
        run: pip install -e ".[dev]"
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
